name: Release iOS to App Store

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-ios:
    name: Build & Upload to App Store
    runs-on: macos-latest

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Apple Certificate and Provisioning Profile
        env:
          KEY_PEM: ${{ secrets.APPLE_CERTIFICATE_KEY_PEM }}
          CER_BASE64: ${{ secrets.APPLE_CERTIFICATE_CER_BASE64 }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # 1. Decode Profile and Certificate
          ruby -e 'require "base64"; File.binwrite("profile.mobileprovision", Base64.decode64(ENV["PROFILE_BASE64"]))'
          ruby -e 'require "base64"; File.binwrite("certificate.cer", Base64.decode64(ENV["CER_BASE64"]))'
          echo "$KEY_PEM" > private_key.key

          # 2. Convert DER to PEM and RSA format
          openssl x509 -inform DER -in certificate.cer -out certificate.pem
          openssl rsa -in private_key.key -out rsa_key.pem

          # 3. Setup Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASS=temp_keychain_password

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 4. Import Apple WWDR Certificate (G3)
          curl -s -f https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # 5. Direct import of RSA Private Key & Certificate into Keychain
          security import rsa_key.pem -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security import certificate.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # 6. Also create and import P12 with simple password as fallback
          openssl pkcs12 -export -inkey rsa_key.pem -in certificate.pem -out certificate.p12 -passout pass:namazpass -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 || true
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P namazpass -T /usr/bin/codesign -T /usr/bin/security || true

          # 7. Authorize codesign tool
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 8. Verify Code Signing Identity
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # 9. Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/a12e0b72-ca77-4e96-9d75-ad65b7ff6e21.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/K3C4QFTVN9.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/com.omrkr.namaz.ogreniyorum.app.mobileprovision

          # 10. Generate ExportOptions.plist
          cat << 'EOF' > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>J8QM75W7A9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.omrkr.namaz.ogreniyorum.app</key>
              <string>com.omrkr.namaz.ogreniyorum.app AppStore</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Build Signed IPA with Flutter
        run: flutter build ipa --release --build-name=1.0 --build-number=${{ github.run_number }} --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA to App Store Connect / TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8 ~/.private_keys/

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Found signed IPA at: $IPA_PATH"
          echo "Uploading to App Store Connect using official Apple altool..."
          xcrun altool --upload-app --type ios -f "$IPA_PATH" --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}"

      - name: Upload Signed IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NamazOgreniyorum-Signed-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30
