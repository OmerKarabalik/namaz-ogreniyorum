name: Release iOS to App Store

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ios-appstore-build
  cancel-in-progress: true

jobs:
  deploy-ios:
    name: Build & Upload to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Pre-compile Flutter iOS Release Assets
        run: |
          flutter build ios --release --no-codesign --build-name=1.0.1 --build-number=${{ github.run_number }}

      - name: Sign, Build IPA and Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: |
          # 1. Create temporary keychain
          export KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          export KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # 2. Run Fastlane to fetch/create certificate, build IPA, and upload
          gem install fastlane --no-document
          cd ios
          fastlane release

      - name: Upload Signed IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NamazOgreniyorum-Signed-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30
