name: Build iOS Simulator (Browser Test)

on:
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build iOS Simulator for Appetize.io
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: |
          flutter build ios --simulator --debug
          cd build/ios/iphonesimulator
          zip -r NamazOgreniyorum-Simulator.zip Runner.app
          mv NamazOgreniyorum-Simulator.zip ../../../

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamazOgreniyorum-Simulator-Appetize
          path: NamazOgreniyorum-Simulator.zip
          retention-days: 14
