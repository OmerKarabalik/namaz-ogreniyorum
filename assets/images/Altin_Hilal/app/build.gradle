plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.altin_hilal'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.altn_hilal"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

// app/build.gradle dosyanızda bunu kullanın:
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Veya kullandığınız en son stabil Java sürümü
        targetCompatibility JavaVersion.VERSION_17 // Veya kullandığınız en son stabil Java sürümü
    }

    buildscript {
        dependencies {
            classpath 'com.android.tools.build:gradle:8.1.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

dependencies {
    // UI
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Diğer
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.activity:activity:1.12.0'// Veya en son stabil sürüm
    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'


}
